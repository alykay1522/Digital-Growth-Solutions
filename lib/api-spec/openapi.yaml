openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification for Digital Agency Website
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact form operations
  - name: services
    description: Agency services
  - name: portfolio
    description: Portfolio projects
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /analyze:
    post:
      operationId: analyzeSite
      tags: [analyze]
      summary: Analyze a website URL for issues
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeSiteInput"
      responses:
        "200":
          description: Site analysis results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeSiteResult"
        "400":
          description: Invalid URL or fetch failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactFormInput"
      responses:
        "200":
          description: Contact form submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactFormResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /services:
    get:
      operationId: getServices
      tags: [services]
      summary: Get all agency services
      responses:
        "200":
          description: List of services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"

  /portfolio:
    get:
      operationId: getPortfolio
      tags: [portfolio]
      summary: Get portfolio projects
      responses:
        "200":
          description: List of portfolio projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioProject"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AnalyzeSiteInput:
      type: object
      properties:
        url:
          type: string
          description: The URL of the website to analyze
      required:
        - url

    SiteIssue:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
          enum: [seo, performance, security, accessibility, mobile, content]
        severity:
          type: string
          enum: [critical, warning, info, pass]
        title:
          type: string
        description:
          type: string
        fix:
          type: string
        value:
          type: string
      required:
        - id
        - category
        - severity
        - title
        - description
        - fix

    AnalyzeSiteResult:
      type: object
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        favicon:
          type: string
        fetchedAt:
          type: string
        scores:
          type: object
          properties:
            seo:
              type: number
            performance:
              type: number
            security:
              type: number
            accessibility:
              type: number
          required: [seo, performance, security, accessibility]
        issues:
          type: array
          items:
            $ref: "#/components/schemas/SiteIssue"
        summary:
          type: object
          properties:
            critical:
              type: number
            warnings:
              type: number
            passes:
              type: number
          required: [critical, warnings, passes]
      required:
        - url
        - title
        - description
        - fetchedAt
        - scores
        - issues
        - summary

    ContactFormInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        company:
          type: string
        service:
          type: string
        message:
          type: string
          minLength: 10
        budget:
          type: string
      required:
        - name
        - email
        - message

    ContactFormResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
      required:
        - error

    Service:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        icon:
          type: string
        features:
          type: array
          items:
            type: string
        category:
          type: string
      required:
        - id
        - title
        - description
        - icon
        - features
        - category

    PortfolioProject:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        clientName:
          type: string
        result:
          type: string
      required:
        - id
        - title
        - description
        - category
        - tags
        - imageUrl
        - clientName
        - result
